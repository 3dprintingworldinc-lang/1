<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0a84ff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hours" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <title>Work Hours & Invoicing</title>
</head>
<body>
  <header class="topbar">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <h1 style="margin:0">Hours</h1>
      <a href="expenses.html" style="font-size:14px;color:#0a84ff;text-decoration:none;font-weight:500">Expenses &rarr;</a>
    </div>
    <div class="summary">
      <div><span class="label">Outstanding</span><span id="outstandingTotal" class="amount">$0.00</span></div>
      <div><span class="label">Paid</span><span id="paidTotal" class="amount muted">$0.00</span></div>
    </div>
  </header>

  <main>
    <section class="card">
      <h2 id="formTitle">Add work entry</h2>
      <form id="entryForm" autocomplete="off">
        <input type="hidden" id="entryId" />

        <label>
          Date
          <input type="date" id="date" required />
        </label>

        <div class="row">
          <label>
            Start time
            <input type="time" id="startTime" />
          </label>
          <label>
            End time
            <input type="time" id="endTime" />
          </label>
        </div>

        <div class="row">
          <label>
            Hours worked
            <input type="number" id="hours" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required />
          </label>
          <label>
            Hourly rate ($)
            <input type="number" id="rate" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required />
          </label>
        </div>

        <label>
          Description (optional)
          <input type="text" id="description" maxlength="200" placeholder="What did you work on?" />
        </label>

        <label class="checkbox">
          <input type="checkbox" id="paid" />
          <span>Already paid</span>
        </label>

        <div class="actions">
          <button type="submit" id="saveBtn" class="primary">Save entry</button>
          <button type="button" id="cancelBtn" class="ghost hidden">Cancel</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="entries-header">
        <h2>Entries</h2>
        <div class="filters">
          <button type="button" class="filter active" data-filter="all">All</button>
          <button type="button" class="filter" data-filter="unpaid">Unpaid</button>
          <button type="button" class="filter" data-filter="paid">Paid</button>
        </div>
      </div>
      <ul id="entries" class="entries"></ul>
      <p id="emptyState" class="empty">No entries yet. Add your first one above.</p>
    </section>

    <section class="card invoice-card">
      <h2>Invoice outstanding work</h2>
      <p class="muted small">Generates an invoice for every entry that has not been marked paid.</p>
      <div class="row">
        <label>
          Your name / business
          <input type="text" id="invoiceFrom" placeholder="Your name" />
        </label>
        <label>
          Bill to
          <input type="text" id="invoiceTo" placeholder="Client name" />
        </label>
      </div>
      <div class="actions">
        <button type="button" id="invoiceBtn" class="primary">Create invoice</button>
        <button type="button" id="markAllPaidBtn" class="ghost">Mark all as paid</button>
      </div>
    </section>
  </main>

  <div id="invoiceModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="invoiceTitle">
    <div class="modal-content">
      <div class="modal-actions no-print">
        <button type="button" id="shareInvoiceBtn" class="primary">Share / Save PDF</button>
        <button type="button" id="closeInvoiceBtn" class="ghost">Close</button>
      </div>
      <div id="invoiceContent" class="invoice"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
